spring.application.name=Backend

# Database Configuration with Environment Variable support
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/interviewai_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sql@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security / JWT
application.security.jwt.secret-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# AI & Mail Services
gemini.api.key=${GEMINI_API_KEY}
resend.api.key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# File Upload Limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB